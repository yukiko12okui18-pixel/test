<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名刺エディター</title>
<style>
  :root {
    --bg: #eef0f2; --panel: #ffffff; --ink: #1f2328; --sub: #5b636b;
    --line: #d4d9de; --accent: #2f5d8a; --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px;
          display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }

  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 16px; line-height: 1.6; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
  legend { font-weight: bold; font-size: 13px; color: var(--accent); margin-bottom: 8px; padding: 0; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--sub); }
  input[type=text] { font: inherit; font-size: 14px; color: var(--ink); padding: 7px 9px;
          border: 1px solid var(--line); border-radius: 6px; width: 100%; }
  input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 11px; color: var(--sub); }

  .preview-area { display: grid; gap: 16px; justify-items: center; position: sticky; top: 16px; }
  .stage { background: #cfd5db; border-radius: 8px; padding: 32px 16px; width: 100%;
           display: flex; justify-content: center; overflow-x: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  button, select { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: bold; }

  /* ===== 名刺本体(91mm × 55mm) ===== */
  .card {
    width: 91mm; height: 55mm; padding: 5mm 6mm; flex: none;
    background: #fff; color: #222; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  }
  .card .company { display: flex; align-items: center; gap: 2mm; font-size: 8pt; font-weight: bold; }
  .card .company img { height: 7mm; }
  .card .company .en { font-weight: normal; font-size: 6pt; color: #666; display: block; }
  .card .dept  { font-size: 7pt; color: #444; }
  .card .name  { font-size: 14pt; font-weight: bold; letter-spacing: .15em; margin-top: .5mm; }
  .card .roman { font-size: 7pt; color: #666; letter-spacing: .05em; }
  .card .contact { font-size: 6pt; line-height: 1.4; color: #333; }
  .card .label { display: inline-block; width: 9mm; color: #888; }

  /* ===== 印刷 ===== */
  #print-sheet { display: none; }
  @media print {
    @page { margin: 0; }
    body { background: #fff; }
    .wrap { display: none; }
    #print-sheet { display: block; }
    #print-sheet .card { box-shadow: none; }
    /* 1枚ずつ(名刺サイズ用紙) */
    body.mode-single #print-sheet .card { page-break-after: always; }
    /* A4 に10枚(2列×5段・一般的な名刺用マルチカード) */
    body.mode-a4 #print-sheet { width: 210mm; padding: 11mm 14mm 0; display: grid;
         grid-template-columns: 91mm 91mm; grid-auto-rows: 55mm; gap: 0; }
  }
</style>
<style id="page-size"></style>
</head>
<body>
<div class="wrap">
  <!-- ===== 入力欄 ===== -->
  <div>
    <h1>名刺エディター</h1>
    <p class="lead">左の欄を書き換えると、右の名刺がすぐ変わります。入力した内容はこのブラウザに自動で保存されます。</p>

    <form class="panel" id="form" autocomplete="off">
      <fieldset>
        <legend>あなたの情報</legend>
        <label>氏名<input type="text" id="氏名"></label>
        <label>ローマ字<input type="text" id="ローマ字"></label>
        <label>部署<input type="text" id="部署"></label>
        <label>役職<input type="text" id="役職"></label>
        <label>携帯<input type="text" id="携帯" inputmode="tel"></label>
        <label>メール<input type="text" id="メール" inputmode="email"></label>
      </fieldset>
      <fieldset>
        <legend>会社の情報(全員共通)</legend>
        <label>会社名<input type="text" id="会社名"></label>
        <label>会社名(英語)<input type="text" id="会社名_英語"></label>
        <label>郵便番号<input type="text" id="郵便番号"></label>
        <label>住所<input type="text" id="住所"></label>
        <label>代表電話<input type="text" id="代表電話"></label>
        <label>URL<input type="text" id="URL"></label>
        <label>ロゴ画像<input type="file" id="ロゴ" accept="image/*"></label>
        <button type="button" id="logo-clear">ロゴを外す</button>
      </fieldset>
      <p class="hint">空欄にした項目(役職・携帯・メール・URLなど)は名刺から自動で消えます。</p>
      <button type="button" id="reset">サンプルに戻す</button>
    </form>
  </div>

  <!-- ===== プレビュー ===== -->
  <div class="preview-area">
    <div class="stage"><div id="preview"></div></div>
    <div class="actions">
      <select id="mode" aria-label="印刷のしかた">
        <option value="a4">A4用紙に10枚ならべて印刷</option>
        <option value="single">名刺サイズの用紙に1枚印刷</option>
      </select>
      <button type="button" class="primary" id="print">印刷する</button>
    </div>
    <p class="hint">「印刷する」→ 送信先で「PDFに保存」を選ぶと PDF にもできます。倍率は「100%(実際のサイズ)」にしてください。</p>
  </div>
</div>

<div id="print-sheet"></div>

<script>
const SAMPLE = {
  氏名: "山田 花子", ローマ字: "Hanako Yamada", 部署: "営業部 第一課", 役職: "主任",
  携帯: "090-1234-5678", メール: "h.yamada@example.co.jp",
  会社名: "株式会社サンプル", 会社名_英語: "Sample Co., Ltd.", 郵便番号: "〒530-0001",
  住所: "大阪府大阪市北区梅田1-2-3 サンプルビル5F", 代表電話: "06-1234-5678",
  URL: "https://www.example.co.jp", ロゴ: ""
};
const KEY = "meishi-editor";
const FIELDS = Object.keys(SAMPLE).filter(k => k !== "ロゴ");
let data = { ...SAMPLE };
try { Object.assign(data, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const row = (label, v) => v ? `<div><span class="label">${label}</span>${esc(v)}</div>` : "";

function cardHTML(d) {
  return `<div class="card">
    <div class="company">
      ${d.ロゴ ? `<img src="${d.ロゴ}" alt="">` : ""}
      <div>${esc(d.会社名)}<span class="en">${esc(d.会社名_英語)}</span></div>
    </div>
    <div>
      <div class="dept">${esc(d.部署)}${d.役職 ? "　" + esc(d.役職) : ""}</div>
      <div class="name">${esc(d.氏名)}</div>
      <div class="roman">${esc(d.ローマ字)}</div>
    </div>
    <div class="contact">
      ${(d.郵便番号 || d.住所) ? `<div>${esc(d.郵便番号)} ${esc(d.住所)}</div>` : ""}
      ${row("TEL", d.代表電話)}${row("携帯", d.携帯)}${row("Mail", d.メール)}${row("Web", d.URL)}
    </div>
  </div>`;
}

function render() {
  document.getElementById("preview").innerHTML = cardHTML(data);
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
}

function fillForm() { FIELDS.forEach(k => { document.getElementById(k).value = data[k] || ""; }); }

FIELDS.forEach(k => document.getElementById(k).addEventListener("input", e => { data[k] = e.target.value; render(); }));

document.getElementById("ロゴ").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { data.ロゴ = r.result; render(); };
  r.readAsDataURL(f);
});
document.getElementById("logo-clear").addEventListener("click", () => {
  data.ロゴ = ""; document.getElementById("ロゴ").value = ""; render();
});
document.getElementById("reset").addEventListener("click", () => {
  data = { ...SAMPLE }; fillForm(); render();
});
document.getElementById("print").addEventListener("click", () => {
  const mode = document.getElementById("mode").value;
  document.body.className = "mode-" + mode;
  document.getElementById("page-size").textContent =
    `@media print { @page { size: ${mode === "a4" ? "210mm 297mm" : "91mm 55mm"}; } }`;
  document.getElementById("print-sheet").innerHTML = cardHTML(data).repeat(mode === "a4" ? 10 : 1);
  window.print();
});

fillForm();
render();
</script>
</body>
</html>
