<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>名刺 - {{氏名}}</title>
<style>
  /* 名刺サイズ(日本の標準:91mm × 55mm) */
  @page { size: 91mm 55mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #eee; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
  .card {
    width: 91mm; height: 55mm; margin: 10mm auto; padding: 5mm 6mm;
    background: #fff; color: #222; position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  @media print { body { background: #fff; } .card { margin: 0; box-shadow: none; } }

  .company { display: flex; align-items: center; gap: 2mm; font-size: 8pt; font-weight: bold; }
  .company img { height: 7mm; }
  .company .en { font-weight: normal; font-size: 6pt; color: #666; display: block; }

  .person .dept  { font-size: 7pt; color: #444; }
  .person .name  { font-size: 14pt; font-weight: bold; letter-spacing: .15em; margin-top: .5mm; }
  .person .roman { font-size: 7pt; color: #666; letter-spacing: .05em; }

  .contact { font-size: 6pt; line-height: 1.4; color: #333; }
  .contact .label { display: inline-block; width: 9mm; color: #888; }
  .empty { display: none; }  /* 空欄の項目は自動で隠す */
</style>
</head>
<body>
  <div class="card">
    <!-- ▼ 会社情報(全員共通) -->
    <div class="company">
      <img src="{{ロゴ画像}}" alt="" class="{{ロゴ画像_class}}">
      <div>{{会社名}}<span class="en">{{会社名_英語}}</span></div>
    </div>

    <!-- ▼ 個人情報(人ごとに変わる) -->
    <div class="person">
      <div class="dept">{{部署}}　<span class="{{役職_class}}">{{役職}}</span></div>
      <div class="name">{{氏名}}</div>
      <div class="roman">{{ローマ字}}</div>
    </div>

    <!-- ▼ 連絡先 -->
    <div class="contact">
      <div>{{郵便番号}} {{住所}}</div>
      <div><span class="label">TEL</span>{{代表電話}}</div>
      <div class="{{携帯_class}}"><span class="label">携帯</span>{{携帯}}</div>
      <div class="{{メール_class}}"><span class="label">Mail</span>{{メール}}</div>
      <div class="{{URL_class}}"><span class="label">Web</span>{{URL}}</div>
    </div>
  </div>
</body>
</html>
